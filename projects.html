<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Ritika Agrawal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .coming-soon {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      text-align: center;
    }

    .coming-soon-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4f46e5, #fb7185);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      font-size: 32px;
    }

    .coming-soon h2 {
      font-size: 28px;
      font-weight: 900;
      color: var(--indigo-dark);
      margin-bottom: 10px;
    }

    .coming-soon p {
      font-size: 14px;
      color: #9ca3af;
      max-width: 320px;
      line-height: 1.65;
    }

    .coming-soon .pill {
      display: inline-block;
      background: var(--coral-light);
      color: #be123c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    body { display: flex; flex-direction: column; min-height: 100vh; }
  </style>
</head>
<body>

  <!-- HAMBURGER -->
  <button class="hamburger" id="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <!-- NAV PANEL -->
  <div class="nav-overlay" id="navOverlay">
    <div class="nav-backdrop" id="navBackdrop"></div>
    <nav class="nav-panel">
      <a href="index.html">Home</a>
      <a href="experience.html">Experience</a>
      <a href="projects.html" class="active">Projects</a>
      <a href="mailto:agrawalritika1811@gmail.com" class="btn-hire">Hire me</a>
    </nav>
  </div>

  <!-- COMING SOON -->
  <div class="coming-soon" data-aos="fade-up" data-aos-duration="600">
    <div class="coming-soon-icon">🎮</div>
    <span class="pill">Work in Progress</span>
    <h2>Coming Soon</h2>
    <p>Projects are being polished and will be live here shortly. Check back soon.</p>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <span class="footer-copy">© 2026 Ritika Agrawal</span>
    <div class="footer-links">
      <a href="https://www.linkedin.com/in/ms-ritika-agrawal/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com/miss-rizz" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:agrawalritika1811@gmail.com" class="email">Email</a>
    </div>
  </footer>

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ once: true });
    const hamburger = document.getElementById('hamburger');
    const navOverlay = document.getElementById('navOverlay');
    const navBackdrop = document.getElementById('navBackdrop');
    hamburger.addEventListener('click', () => navOverlay.classList.toggle('open'));
    navBackdrop.addEventListener('click', () => navOverlay.classList.remove('open'));
  </script>
</body>
</html>
