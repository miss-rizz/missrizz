<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ritika Agrawal — Miss Rizz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Glass+Antiqua&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Le Jour Serif';
      src: url('fonts/le-jour-serif/Le Jour Serif.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'Magazine';
      src: url('fonts/magazine/Magazine.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'Magazine';
      src: url('fonts/magazine/Magazine-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }

    .hero {
      flex: 1;
      display: grid;
      grid-template-columns: 6fr 4fr;
      min-height: calc(100vh - 45px - 57px);
    }

    /* SLIDESHOW */
    .hero-photo {
      background: linear-gradient(135deg, #4f46e5 0%, #818cf8 55%, #fb7185 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .slideshow {
      width: min(520px, 75%);
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      border: 4px solid rgba(255,255,255,0.35);
      box-shadow:
        0 0 4px  14px  rgba(255,255,255,0.18),
        0 0 4px  28px  rgba(199,210,254,0.15),
        0 0 4px  44px  rgba(165,180,252,0.13),
        0 0 4px  62px  rgba(129,140,248,0.11),
        0 0 4px  82px  rgba(199,210,254,0.09),
        0 0 4px  104px rgba(165,180,252,0.08),
        0 0 4px  128px rgba(129,140,248,0.06),
        0 0 4px  154px rgba(199,210,254,0.05),
        0 0 4px  182px rgba(165,180,252,0.04),
        0 0 4px  212px rgba(129,140,248,0.03),
        0 0 4px  244px rgba(199,210,254,0.025),
        0 0 4px  278px rgba(165,180,252,0.02),
        0 0 4px  314px rgba(255,255,255,0.015),
        0 0 4px  352px rgba(199,210,254,0.01),
        0 0 4px  392px rgba(129,140,248,0.008);
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .slide.active { opacity: 1; }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    .slide-dots {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 5;
    }

    .slide-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: background 0.3s;
    }

    .slide-dot.active { background: #fff; }

    /* RIGHT TEXT */
    .hero-text {
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 36px;
      text-align: left;
      overflow: hidden;
      border-left: 1px solid #000;
    }

    .hero-name {
      font-family: 'Glass Antiqua', serif;
      font-size: 68px;
      font-weight: 600;
      color: var(--indigo-dark);
      line-height: 1.1;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .hero-name span { color: var(--indigo); font-size: 36px; }

    .hero-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .tagline-bar {
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 13px 40px;
      text-align: center;
    }

    .tagline-bar p {
      font-size: 12px;
      color: #9ca3af;
      font-style: italic;
      letter-spacing: 0.3px;
    }

    @media (max-width: 768px) {
      .hero { grid-template-columns: 1fr; }
      .hero-photo { min-height: 300px; }
      .slideshow { width: min(260px, 55%); }
      .hero-text { padding: 36px 24px; }
      .hero-name { font-size: 48px; }
    }
  </style>
</head>
<body>

  <!-- TOP RIGHT ACTIONS -->
  <div style="position:fixed;top:20px;right:24px;z-index:300;display:flex;align-items:center;gap:14px;">
    <a href="mailto:agrawalritika1811@gmail.com" class="btn-hire">Hire me</a>
    <button class="hamburger" id="hamburger" aria-label="Menu" style="position:static;">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- NAV PANEL -->
  <div class="nav-overlay" id="navOverlay">
    <div class="nav-backdrop" id="navBackdrop"></div>
    <nav class="nav-panel">
      <a href="/">Home</a>
      <a href="experience.html">Experience</a>
      <a href="projects.html">Projects</a>
      <a href="mailto:agrawalritika1811@gmail.com" class="btn-hire">Hire me</a>
    </nav>
  </div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-photo">
      <div class="slideshow" id="slideshow">
        <div class="slide active"><img src="assets/img/my_pics/photo-1.jpeg" alt="Ritika Agrawal" /></div>
        <div class="slide"><img src="assets/img/my_pics/photo-4.jpeg" alt="Ritika Agrawal" /></div>
        <div class="slide"><img src="assets/img/my_pics/photo-5.jpeg" alt="Ritika Agrawal" /></div>
      </div>
      <div class="slide-dots" id="dots"></div>
      <p id="tagline" style="position:absolute;bottom:72px;left:50%;transform:translateX(-50%);font-size:13px;color:rgba(255,255,255,1.0);font-style:italic;letter-spacing:0.4px;white-space:nowrap;transition:opacity 1.2s ease;">Tea over coffee, you can't change my mind.</p>
    </div>

    <div class="hero-text" data-aos="fade-left" data-aos-duration="700" data-aos-delay="100">
      <img src="assets/img/name-display.jpg" alt="Ritika Agrawal" style="width:100%;height:100%;object-fit:contain;transform:scale(1.2);transform-origin:left center;" />
    </div>
  </section>


  <!-- FOOTER -->
  <footer class="footer">
    <span class="footer-copy">© 2026 Ritika Agrawal</span>
    <div class="footer-links">
      <a href="https://www.linkedin.com/in/ms-ritika-agrawal/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com/miss-rizz" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:agrawalritika1811@gmail.com" class="email">Email</a>
    </div>
  </footer>

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ once: true });

    const hamburger = document.getElementById('hamburger');
    const navOverlay = document.getElementById('navOverlay');
    const navBackdrop = document.getElementById('navBackdrop');
    hamburger.addEventListener('click', () => navOverlay.classList.toggle('open'));
    navBackdrop.addEventListener('click', () => navOverlay.classList.remove('open'));

    const slides = document.querySelectorAll('.slide');
    const dotsContainer = document.getElementById('dots');
    let current = 0;

    slides.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'slide-dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsContainer.appendChild(dot);
    });

    function goTo(n) {
      slides[current].classList.remove('active');
      dotsContainer.children[current].classList.remove('active');
      current = n;
      slides[current].classList.add('active');
      dotsContainer.children[current].classList.add('active');
    }

    setInterval(() => goTo((current + 1) % slides.length), 3500);

    const taglines = [
      "Tea over coffee, you can't change my mind.",
      "Acting Non-chalant in chaos is my superpower.",
      "You can reject me, but you will never forget me."
    ];
    const taglineEl = document.getElementById('tagline');
    let taglineCurrent = 0;
    setInterval(() => {
      taglineEl.style.opacity = '0';
      setTimeout(() => {
        taglineCurrent = (taglineCurrent + 1) % taglines.length;
        taglineEl.textContent = taglines[taglineCurrent];
        taglineEl.style.opacity = '1';
      }, 1200);
    }, 6000);
  </script>
</body>
</html>
